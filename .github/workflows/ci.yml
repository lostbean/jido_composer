name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      ANTHROPIC_API_KEY: test-cassette-key
      RECORD_CASSETTES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check design layer
        run: nix run .#design-gate-check -- docs/design .
      - name: Cache Elixir deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: quality-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'mix.lock', 'mix.exs') }}
      - name: Setup dependencies
        run: |
          nix develop .#ci --command mix deps.get
          nix develop .#ci --command mix deps.compile
      - name: Run CI checks
        run: nix develop .#ci --command mix ci || (echo "::group::Formatter diff" && git diff && echo "::endgroup::" && exit 1)
  compatibility:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1_18", otp: "27"}
          - {elixir: "1_19", otp: "27"}
          - {elixir: "1_19", otp: "28"}
          - {elixir: "1_20", otp: "27"}
          - {elixir: "1_20", otp: "28"}
          - {elixir: "1_20", otp: "29"}
    env:
      MIX_ENV: test
      ANTHROPIC_API_KEY: test-cassette-key
      RECORD_CASSETTES: "false"
      BEAM_SHELL: ci-${{ matrix.elixir }}-${{ matrix.otp }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Cache dependencies and compiled modules
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: compatibility-v2-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-test-${{ hashFiles('flake.lock', 'mix.lock', 'mix.exs') }}
      - name: Show toolchain
        run: nix develop ".#$BEAM_SHELL" --command elixir --version
      - name: Fetch dependencies
        run: nix develop ".#$BEAM_SHELL" --command mix deps.get --check-locked
      - name: Compile dependencies
        run: nix develop ".#$BEAM_SHELL" --command mix deps.compile
      - name: Compile project
        run: nix develop ".#$BEAM_SHELL" --command mix compile --warnings-as-errors
      - name: Test
        run: nix develop ".#$BEAM_SHELL" --command mix test
